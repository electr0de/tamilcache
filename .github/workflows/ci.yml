name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          # Pinned to the exact patch the image builds on. Two ways this matters: better-sqlite3's
          # prebuilt binary is tied to the Node ABI, and `require()` of the ESM-only `cookie@2`
          # (reached via fastify → light-my-request → inject) needs Node >= 22.12.
          node-version: 22.23.5
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest gate first: if a torrent, a database, a real infohash or a working note
      # ever reaches the tree, nothing else needs to run.
      - run: pnpm check:leaks

      # MUST precede the tests: apps/* resolve @tamilcache/* from dist/, which is git-ignored.
      - run: pnpm -r build

      - run: npx vitest run

      - run: pnpm -r typecheck
